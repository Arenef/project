<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hôm Nay Ăn Gì?</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="fade-in">
            <h1>Hôm Nay Ăn Gì? 🤔</h1>
            <p>Đừng đau đầu nữa, để tôi chọn giúp bạn nhé!</p>
        </header>

        <main>
            <div id="result-container" class="result-container">
                <!-- Card kết quả sẽ xuất hiện ở đây -->
                <div class="empty-state">
                    Bấm nút bên dưới để xem gợi ý hôm nay! 👇
                </div>
            </div>

            <button id="random-btn" class="btn-primary fade-in">
                <span>🎲 Chọn Món Ngẫu Nhiên</span>
                <div class="loader" id="btn-loader"></div>
            </button>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
