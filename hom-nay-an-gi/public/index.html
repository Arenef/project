<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hôm Nay Ăn Gì?</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.reload()">
                <i class="ph-fill ph-fork-knife" style="color:var(--primary-color)"></i> Hôm Nay Ăn Gì?
            </div>
            
            <ul class="nav-links">
                <li><a href="#" class="active" id="nav-home">Trang chủ</a></li>
                <li><a href="#" id="nav-foods">Món ăn</a></li>
            </ul>
            <div class="user-controls" id="user-controls">
                <!-- Nội dung sẽ được render bằng JS -->
            </div>
        </div>
    </nav>

    <div class="container fade-in">
        <!-- Bố cục chính 2 cột -->
        <div class="main-layout-grid" id="main-layout-grid">
            
            <!-- Cột Trái -->
            <div class="left-column">
                <header class="hero-section" id="hero-section">
                    <h1>Không biết ăn gì? 🤔</h1>
                    <p>Để tôi quyết định giúp bạn!</p>
                    
                    <div class="random-section" id="random-section">
                        <div id="random-content-area" class="random-content-area">
                            <!-- Nút bấm to ban đầu -->
                            <div class="random-circle-wrapper" id="initial-random-wrapper">
                                <button id="random-btn" class="random-circle-btn">
                                    <i class="ph-fill ph-dice-five"></i>
                                    <span>Quay Random</span>
                                </button>
                            </div>
                            
                            <div class="hint-text" id="initial-hint-text">
                                <i class="ph ph-arrow-bend-left-up arrow-icon"></i>
                                Nhấn vào để chọn món ngẫu nhiên
                            </div>

                            <!-- Nơi chứa thẻ bài kết quả ngang (ẩn ban đầu) -->
                            <div id="random-result-card" style="display: none; width: 100%;"></div>
                            
                            <!-- Nút bấm quay lại (ẩn ban đầu) -->
                            <button id="random-btn-again" class="btn-primary btn-large btn-spin-again" style="display: none; margin-top: 1rem; padding: 1rem 3rem; border-radius: 50px; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(255, 90, 95, 0.3);">
                                <i class="ph-bold ph-arrows-clockwise"></i> <span>Quay Lại Lần Nữa</span>
                            </button>
                        </div>
                    </div>
                </header>

                <!-- Khu vực Chọn theo loại bữa ăn -->
                <section class="category-block" id="category-section">
                    <div class="category-header">
                        <i class="ph-regular ph-clock"></i> Chọn theo loại bữa ăn
                    </div>
                    <div class="category-filters">
                        <button class="pill active" data-tag="all">
                            <span class="icon-wrap" style="color:var(--primary-color)"><i class="ph-fill ph-squares-four"></i></span>
                            Tất cả
                        </button>
                        <button class="pill" data-tag="Sáng">
                            <span class="icon-wrap" style="color:#f59e0b"><i class="ph-fill ph-sun"></i></span>
                            Sáng
                        </button>
                        <button class="pill" data-tag="Trưa">
                            <span class="icon-wrap" style="color:#d97706"><i class="ph-fill ph-sun-dim"></i></span>
                            Trưa
                        </button>
                        <button class="pill" data-tag="Tối">
                            <span class="icon-wrap" style="color:#6366f1"><i class="ph-fill ph-moon"></i></span>
                            Tối
                        </button>
                        <button class="pill" data-tag="Ăn vặt">
                            <span class="icon-wrap" style="color:#10b981"><i class="ph-fill ph-television"></i></span>
                            Ăn vặt
                        </button>
                        <button class="pill" data-tag="Đồ uống">
                            <span class="icon-wrap" style="color:#3b82f6"><i class="ph-fill ph-coffee"></i></span>
                            Đồ uống
                        </button>
                    </div>
                </section>
            </div>

            <!-- Cột Phải -->
            <div class="right-column">
                <!-- Khu vực Bảng xếp hạng -->
                <section class="ranking-block">
                    <div class="ranking-header-top">
                        <h2 style="font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
                            <i class="ph-fill ph-trophy" style="color:#f59e0b"></i> Bảng xếp hạng món ăn
                        </h2>
                        <div class="ranking-tabs">
                            <button class="pill-sm active" id="rank-day" data-rank="day" onclick="fetchRanking('day')">Ngày</button>
                            <button class="pill-sm" id="rank-week" data-rank="week" onclick="fetchRanking('week')">Tuần</button>
                            <button class="pill-sm" id="rank-month" data-rank="month" onclick="fetchRanking('month')">Tháng</button>
                            <button class="pill-sm" id="rank-year" data-rank="year" onclick="fetchRanking('year')">Năm</button>
                        </div>
                    </div>
                    
                    <!-- Danh sách món ăn top (dọc) -->
                    <div id="ranking-container" class="ranking-list">
                        <div class="empty-state-card" style="width: 100%; text-align: center; color: var(--text-light, #888);">
                            Đang tải bảng xếp hạng...
                        </div>
                    </div>

                    <div class="view-all-ranking">
                        <button class="btn-link">Xem tất cả bảng xếp hạng <i class="ph-bold ph-arrow-right"></i></button>
                    </div>
                </section>

                <!-- Banner Thêm món ăn - ĐÃ XÓA -->
            </div>
            
        </div> <!-- End Grid 2 cột -->

        <!-- Search Bar (ẩn mặc định, hiện khi ấn Món ăn) -->
        <div id="search-bar-wrapper" style="display: none; justify-content: center; margin-bottom: 2rem; margin-top: 1rem;">
            <div style="display: flex; gap: 10px; width: 100%; max-width: 500px;">
                <input type="text" id="search-input" placeholder="Tìm tên món (Phở, Cơm...)" style="flex: 1; padding: 0.75rem 1.5rem; border-radius: 30px; border: 1px solid var(--border-color); outline: none; font-size: 0.95rem;">
                <button id="search-btn" class="btn-primary" style="padding: 0 1.5rem; border-radius: 30px;">Tìm</button>
            </div>
        </div>

        <!-- Khu vực Hiện kết quả Grid (dành cho tab Món ăn) -->
        <main>
            <div id="result-container" class="food-grid">
                <!-- Kết quả món ăn sẽ xuất hiện ở đây -->
            </div>
        </main>
    </div>

    <!-- Modal Đăng nhập -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('login-modal')">&times;</span>
            <h2>Đăng Nhập</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Tên tài khoản hoặc Email</label>
                    <input type="text" id="login-username" required placeholder="Nhập tài khoản">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="login-password" required placeholder="Nhập mật khẩu">
                </div>
                <div id="login-error" class="error-text"></div>
                <button type="submit" class="btn-primary w-100">Vào Đời</button>
            </form>
            <p class="modal-switch">Chưa có tài khoản? <a href="#" onclick="switchModal('login-modal', 'register-modal')">Đăng ký ngay</a></p>
        </div>
    </div>

    <!-- Modal Đăng ký -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('register-modal')">&times;</span>
            <h2>Tạo Tài Khoản</h2>
            <form id="register-form">
                <div class="form-group">
                    <label>Tên tài khoản</label>
                    <input type="text" id="register-username" required placeholder="Viết liền không dấu">
                </div>
                <div class="form-group">
                    <label>Email (Tùy chọn)</label>
                    <input type="email" id="register-email" placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="register-password" required placeholder="Tối thiểu 6 ký tự">
                </div>
                <div id="register-error" class="error-text"></div>
                <button type="submit" class="btn-primary w-100">Đăng Ký</button>
            </form>
            <p class="modal-switch">Đã có tài khoản? <a href="#" onclick="switchModal('register-modal', 'login-modal')">Đăng nhập</a></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
